<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="loginForm.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <title>login page</title>
    </head>

    <body>
        <div class="body_container">
            <div class="left">
                <div class="top">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="middle">
                    <h3>Welcome Back!</h3>
                    <p><i>Login to access your account and enjoy our services</i></p>
                </div>

                <div class="bottom">
                    <img src="Images/laptop.png" alt="">
                </div>
            </div>

            <div class="right">
                <form action="" name="logForm">
                    <h4>Login Form</h4>

                    <div class="input">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="text" placeholder="Email Address">
                    </div>

                    <div class="input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </div>

                    <div class="remember">
                        <div>
                            <input type="checkbox" id="checkMe">
                            <label for="checkMe">Remember Me</label>
                        </div>
                        <div>
                            <p id="forgot"><a href="">Forgot Password?</a></p>
                        </div>
                    </div>

                    <button type="submit">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login</button>

                    <p class="stick_para"><span class="stick"></span>&nbsp;or login with&nbsp;<span class="stick"></span></p>

                    <div class="company_icon">
                        
                        <div class="brand_icon">
                            <i class="fa-brands fa-google"></i>
                            <i class="fa-brands fa-facebook"></i>
                            <i class="fa-brands fa-github"></i>
                        </div>
                        <p>Don't have account?&nbsp;&nbsp;<a href="">Register</a></p>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
