<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <title>Home | Weather</title>
</head>
<body>

    <header>
        <div class="left">
            <i class="fa-solid fa-cloud-sun-rain"></i><h2><span class="head_cont">Weather</span><span class="head_cont_2">App</span></h2>
        </div>

        <div class="center">
            <p><a href=""><i class="fa-solid fa-house"></i>Home</a></p>
            <p><a href=""><i class="fa-solid fa-chart-simple"></i>Forecast</a></p>
            <p><a href=""><i class="fa-solid fa-info"></i>About</a></p>
            <p><a href=""><i class="fa-solid fa-phone"></i>Contact</a></p>
        </div>

        <div class="right">
            <p><i class="fa-solid fa-globe"></i>En<i><i class="fa-solid fa-chevron-down"></i></p>
        </div>
    </header>
    

    <main>
        <div class="background_image">
            <div class="first_class">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="Search City">
            </div>

            <div class="second_class">
                <div class="sun_icon"><i class="fa-solid fa-cloud-sun-rain"></i></div>
                <div class="temperature">
                    <h1>28<sup>&deg;</sup>C</h1>
                    <p>Partly Cloudy</p>
                </div>
            </div>

            <div class="third_class">
                <i class="fa-solid fa-location-dot"></i>Dar Es Salaam,&nbsp;Tanzania
            </div>

            <div class="fourth_class">
                <div class="stick">
                    <i class="fa-solid fa-temperature-half"></i>
                    <p><span class="span_1">Humidity</span><span>76%</span></p>
                </div>

                <div class="stick">
                    <i class="fa-solid fa-wind"></i>
                    <p><span class="span_1">Wind</span><span>12km/h</span></p>
                </div>
                
                <div class="stick">
                    <i class="fa-solid fa-sun"></i>
                    <p><span class="span_1">Sunrise</span><span><time datetime="">06:12 AM</time></span></p>
                </div>

                <div>
                    <i class="fa-solid fa-sun"></i>
                    <p><span class="span_1">Sunset</span><span><time datetime="">06:12 PM</time></span></p>
                </div>
            </div>
        </div>

        <div class="table">
            <table></table>
            <table></table>
            <table></table>
        </div>
    </main>

    <footer>
        <div class="footer_cont_1">
            <div><i class="fa-solid fa-cloud-sun-rain"></i></div>
            <div><h5><span class="sp_1">Weather</span><span class="sp_2">App</span></h5></div>
        </div>

        <div class="footer_cont_2">
            <div>
                <a href=""><i class="fa-brands fa-facebook"></i></a>
                <a href=""><i class="fa-brands fa-square-twitter"></i></a>
                <a href=""><i class="fa-brands fa-youtube"></i></a>
                <a href=""><i class="fa-brands fa-linkedin"></i></a>
            </div>
            <div>
                <p><i class="fa-regular fa-copyright"></i>2026 WeatherApp</p>
                <p>All right reserved</p>
            </div>
        </div>
    </footer>
</body>
</html>
